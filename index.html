<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="SOOP 방송과 OBS에 활용할 수 있는 편리한 방송 도구 모음집">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>방송도구 모음집</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    :root{--bg:#f2f4fa;--surface:#fff;--ink:#171a26;--muted:#686e82;--line:#e4e7f0;--accent:#5b5ff5;--accent-dark:#4448d2;--soft:#eceeff}
    *{box-sizing:border-box}html{-webkit-font-smoothing:antialiased}body{min-height:100vh;margin:0;color:var(--ink);background:var(--bg);background-image:radial-gradient(circle at 10% 0,rgba(91,95,245,.13),transparent 35%),radial-gradient(circle at 95% 15%,rgba(95,198,255,.13),transparent 32%);font-family:Pretendard,"Noto Sans KR",sans-serif}
    .shell{width:min(960px,calc(100% - 40px));margin:0 auto;padding:64px 0}
    h1{margin:0 0 28px;font-size:32px;line-height:1.2;letter-spacing:-.045em}
    .tools{display:flex;flex-direction:column;gap:12px}.tool-card{display:flex;padding:24px 26px;border:1px solid var(--line);border-radius:14px;color:inherit;background:rgba(255,255,255,.92);text-decoration:none;transition:border-color .15s ease,background .15s ease}.tool-card:hover{border-color:#cfd2ff;background:#fff}.card-content{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 24px;width:100%}.tool-card h3{grid-column:1;margin:0;font-size:18px;letter-spacing:-.025em}.tool-card p{grid-column:1;max-width:680px;margin:0;color:var(--muted);font-size:13px;line-height:1.55}.open{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:7px;color:var(--accent-dark);font-size:13px;font-weight:800}.open b{font-size:18px;transition:transform .2s}.tool-card:hover .open b{transform:translateX(4px)}
    .soon{cursor:default;box-shadow:none}.soon:hover{transform:none;border-color:var(--line);box-shadow:none}.soon .icon{color:#777d91;background:#eceef4;box-shadow:none}.soon .open{color:#8b90a2}
    footer{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);color:#9296a7;font-size:12px}
    @media(max-width:720px){.shell{width:min(100% - 28px,960px);padding:40px 0}.tool-card{padding:20px}.card-content{grid-template-columns:1fr}.open{grid-column:1;grid-row:auto;margin-top:8px}.tool-card p{grid-column:1}}
  </style>
</head>
<body>
  <main class="shell">
    <h1>방송도구모음</h1>
    <section class="tools" aria-label="방송 도구 목록">
      <a class="tool-card primary" href="/upranking.html">
        <div class="card-content">
          <h3>업순위 오버레이 생성기</h3>
          <p>SOOP 댓글의 UP 순위를 실시간으로 보여주는 OBS용 오버레이를 원하는 디자인으로 만드세요.</p>
          <span class="open">도구 열기 <b aria-hidden="true">→</b></span>
        </div>
      </a>
      <a class="tool-card" href="/linkcard-studio.html">
        <div class="card-content">
          <h3>링크카드 스튜디오</h3>
          <p>프로필과 여러 링크를 하나의 카드로 디자인하고, SOOP 게시글에 바로 사용할 HTML 코드를 만드세요.</p>
          <span class="open">도구 열기 <b aria-hidden="true">→</b></span>
        </div>
      </a>
      <a class="tool-card" href="/score-overlay/">
        <div class="card-content">
          <h3>스코어 오버레이</h3>
          <p>여러 팀의 점수를 실시간으로 관리하고, 순위 변화를 OBS 화면에 보기 좋게 표시하세요.</p>
          <span class="open">도구 열기 <b aria-hidden="true">→</b></span>
        </div>
      </a>
    </section>
    <footer>SOOP 방송과 OBS를 위한 개인 방송 도구 모음</footer>
  </main>
</body>
</html>
