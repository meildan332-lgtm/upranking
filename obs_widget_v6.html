<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>OBS 댓글 랭킹 위젯 v6</title>
    <style>

        /* 맨 위 고정 댓글 강조 디자인 */
        .highlight-item {
            background-color: #ffeb3b !important; /* 노란색 배경 (원하는 색으로 변경 가능) */
            border: 2px solid #fbc02d;
            font-weight: bold;
        }
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --accent-color: #FF3B30;
            --accent-color-rgb: 255, 59, 48;

            --text-primary: #ffffff;
            --text-secondary: #ffffff;
            --text-muted: #ffffff;
            --container-bg: rgba(0, 0, 0, 0.7);
            --card-bg: rgba(24, 24, 24, 1);
            --card-border: #333;
            --card-shadow: rgba(0, 0, 0, 0.5);
            --deadline-bg: rgba(0, 0, 0, 0.6);
            --pinned-bg: rgba(10, 25, 40, 0.95);
            --qr-bg: rgba(24, 24, 24, 0.85);
            --qr-border: #444;
            --qr-desc-color: #ddd;
            --header-text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            --update-text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }

        /* ===== 라이트 모드: body에 theme-light 클래스가 붙으면 적용됨 (디자인1/디자인2 공통) ===== */
        body.theme-light {
            --text-primary: #1a1d29;
            --text-secondary: #3d4152;
            --text-muted: #6b7086;
            --container-bg: rgba(255, 255, 255, 0.82);
            --card-bg: rgba(255, 255, 255, 0.97);
            --card-border: #e5e7f0;
            --card-shadow: rgba(30, 34, 70, 0.12);
            --deadline-bg: rgba(255, 255, 255, 0.8);
            --pinned-bg: color-mix(in srgb, var(--accent-color) 16%, white 84%);
            --qr-bg: rgba(255, 255, 255, 0.92);
            --qr-border: #e5e7f0;
            --qr-desc-color: #3d4152;
            --header-text-shadow: none;
            --update-text-shadow: none;
        }

        body {
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Pretendard', sans-serif;
            color: var(--text-primary);
            width: 100vw;
            height: 100vh;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* 실제 OBS 브라우저 소스 크기와 상관없이 항상 500x1000 기준으로 디자인되고,
           JS가 실제 박스 크기에 맞춰 이 캔버스를 통째로 축소/확대함 */
        #scale-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 500px;
            height: 1000px;
            padding: 20px;
            box-sizing: border-box;
            transform-origin: top left;
        }

        #widget-container {
            width: 100%; max-width: 550px; display: flex; flex-direction: column; gap: 12px;
            background-color: var(--container-bg);
            padding: 20px;
            border-radius: 16px;
            box-sizing: border-box;
        }

        #widget-main { display: flex; flex-direction: column; gap: 12px; }
        #ranking-section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
        #qr-column { display: none; flex-direction: column; gap: 12px; min-width: 0; }
        body.qr-bottom #qr-column { order: 2; }
        body.qr-bottom #ranking-section { order: 1; }
        body.qr-bottom #qr-column .qr-cutoff-slot { order: 1; }
        body.qr-bottom #qr-column .deadline-countdown { order: 2; }
        body.qr-bottom #qr-column #qr-section { order: 3; }

        body.layout-horizontal #scale-stage {
            width: 900px;
            height: 500px;
        }
        body.layout-horizontal #widget-container { max-width: none; }
        body.layout-horizontal #widget-main {
            flex-direction: row;
            align-items: flex-start;
            gap: 18px;
        }
        body.layout-horizontal #qr-column {
            flex: 0 0 var(--qr-column-width, 50%);
            width: var(--qr-column-width, 50%);
            align-self: flex-start;
        }
        body.layout-horizontal .qr-section {
            width: 100%;
            flex-direction: column;
            flex-wrap: nowrap;
            margin-top: 0;
        }
        body.layout-horizontal .qr-image { width: 100%; margin: 0 auto; }
        body.layout-horizontal .qr-text-col { flex: 0 0 auto; min-width: 0; width: 100%; }
        body.layout-horizontal #ranking-section { flex: 1 1 0; }

        /* 헤더 부분 좌우 정렬을 위한 flex 속성 */
        .widget-header {
            display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 0px; text-shadow: var(--header-text-shadow);
        }
        .widget-title { font-size: 24px; font-weight: 800; color: var(--text-primary); margin: 0; }
        .deadline-text { font-size: 14px; color: var(--text-primary); font-weight: bold; background: var(--deadline-bg); padding: 4px 8px; border-radius: 6px; }
        .deadline-countdown {
            display: none;
            width: 100%;
            padding: 4px 0;
            border: 0;
            box-sizing: border-box;
            background: transparent;
            color: var(--text-primary);
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            perspective: 500px;
        }
        .countdown-unit { display: inline-flex; align-items: flex-end; gap: 5px; }
        .countdown-value {
            display: inline-flex;
            min-width: 54px;
            height: 54px;
            padding: 0 7px;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            border: 1px solid rgba(120, 145, 175, .28);
            border-radius: 5px;
            background: rgba(225, 239, 251, .92);
            color: #101820;
            font-size: 34px;
            font-weight: 900;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            transform-origin: center;
        }
        .countdown-label {
            padding-bottom: 7px;
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 800;
        }
        .countdown-value.is-flipping { animation: countdownFlip .42s ease; }
        @keyframes countdownFlip {
            0% { transform: rotateX(0deg); }
            45% { transform: rotateX(-72deg) scaleY(.92); opacity: .45; }
            55% { transform: rotateX(55deg) scaleY(.92); opacity: .55; }
            100% { transform: rotateX(0deg); opacity: 1; }
        }
        body:not(.theme-light) .countdown-value {
            border-color: #555;
            background: #292a2e;
            color: #fff;
        }
        .countdown-ended { font-size: 22px; color: var(--text-primary); }

        /* 댓글 목록 자체에 간격을 줘서 커트라인/다음 댓글이 서로 겹치지 않도록 함 */
        #comment-list { display: flex; flex-direction: column; gap: 10px; }

        .comment-box {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 10px var(--card-shadow);
            will-change: transform, opacity;
        }

        .rank-col { width: 40px; margin-right: 15px; position: relative; display: flex; align-items: center; justify-content: center; }
        .rank-number { font-size: 26px; font-weight: 900; line-height: 1; color: var(--text-primary); }
        .rank-delta-slot { position: absolute; top: 100%; left: 0; right: 0; margin-top: 3px; font-size: 11px; line-height: 1; text-align: center; }
        .rank-danger { display: block; margin-top: 4px; color: #ff3b30; font-size: 12px; font-weight: 900; line-height: 1; text-align: center; text-shadow: none; }
        .profile-pic { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background-color: #444; margin-right: 15px; border: 1px solid #444; }
        
        .info-col { display: flex; flex-direction: column; justify-content: center; gap: 2px; flex: 1; }
        .nickname-wrapper { display: flex; align-items: center; gap: 6px; }
        .nickname { font-size: 17px; font-weight: 800; color: var(--text-primary); }
        .highlight-badge { background-color: var(--accent-color, #76c944); color: white; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 10px; }
        .userid { font-size: 14px; color: var(--text-secondary); font-weight: 500; }
        .post-date { font-size: 13px; color: var(--text-secondary); }

        .up-col { display: flex; align-items: center; gap: 6px; font-size: 22px; font-weight: 900; color: var(--accent-color, #FF3B30); }
        .thumb-icon { flex-shrink: 0; color: var(--accent-color, #FF3B30); }
        .up-delta-slot { font-size: 13px; font-weight: 800; }

        .delta-badge { display: inline-block; }
        .delta-up { color: #4CAF50; }
        .delta-down { color: #FF5252; }

        .pinned-comment { border: 2px solid var(--accent-color, #00BFFF); background-color: var(--pinned-bg); box-shadow: none; }

        /* ===== 디자인1: 순위 · 프로필 · 닉네임 · 추천수만 표시 ===== */
        body:not(.design-ios) .comment-box {
            min-height: 76px;
            padding: 0 10px 0 0;
            border-radius: 10px;
            overflow: hidden;
            gap: 0;
        }
        body:not(.design-ios) .rank-col {
            width: auto;
            min-width: 34px;
            margin: 0 10px 0 22px;
            flex: 0 0 auto;
            order: 2;
        }
        body:not(.design-ios) .rank-number {
            font-size: 23px;
            font-weight: 800;
        }
        body:not(.design-ios) .profile-pic {
            align-self: center;
            width: 76px;
            height: 76px;
            min-height: 0;
            aspect-ratio: 1 / 1;
            margin-right: 0;
            border: 0;
            border-radius: 0;
            object-fit: cover;
            object-position: center;
            flex: 0 0 76px;
            order: 1;
        }
        body:not(.design-ios) .info-col {
            min-width: 0;
            justify-content: center;
            flex: 1 1 auto;
            padding-left: 12px;
            order: 3;
        }
        body:not(.design-ios) .nickname {
            font-size: 23px;
            line-height: 1.3;
            overflow: visible;
            text-overflow: clip;
            white-space: nowrap;
        }
        body:not(.design-ios) .up-col {
            margin-left: 12px;
            padding-left: 8px;
            font-size: 22px;
            color: var(--text-primary);
            min-width: 100px;
            justify-content: flex-end;
            flex-shrink: 0;
            transform: translateX(-20px);
            order: 4;
        }
        body:not(.design-ios) .up-col::before {
            content: "UP";
            order: 3;
            align-self: flex-end;
            margin-left: -2px;
            margin-bottom: -2px;
            transform: translateY(-8px);
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0.02em;
        }
        body:not(.design-ios) .up-count {
            order: 2;
        }
        body:not(.design-ios) .up-delta-slot {
            order: 1;
            display: inline-flex;
            align-items: center;
            margin-right: 2px;
            font-size: 12px;
            line-height: 1;
            white-space: nowrap;
        }
        body:not(.design-ios) .up-delta-slot .delta-arrow {
            margin-right: 1px;
            font-size: 10px;
        }
        body:not(.design-ios) .thumb-icon {
            display: none;
        }
        body:not(.design-ios) .userid,
        body:not(.design-ios) .rank-delta-slot,
        body:not(.design-ios) .rank-danger,
        body:not(.design-ios) .highlight-badge {
            display: none !important;
        }
        body:not(.design-ios) .pinned-comment {
            border: 1px solid var(--card-border);
            min-height: 76px;
        }
        body:not(.design-ios):not(.theme-light) .pinned-comment {
            background: #333;
            border-color: #777;
        }
        body:not(.design-ios):not(.theme-light) .comment-box:not(.pinned-comment) {
            background: #000;
        }
        body:not(.design-ios):not(.theme-light) .comment-box.grayed-out {
            opacity: 1;
        }
        body:not(.design-ios) .pinned-comment .profile-pic {
            width: 76px;
            height: 76px;
            min-height: 0;
            flex-basis: 76px;
        }
        body:not(.design-ios) .pinned-comment .rank-number,
        body:not(.design-ios) .pinned-comment .nickname {
            font-size: 23px;
        }
        body:not(.design-ios) .pinned-comment .up-col {
            font-size: 22px;
            min-width: 100px;
        }
        body:not(.design-ios).theme-light .comment-box .up-col,
        body:not(.design-ios).theme-light .comment-box .thumb-icon {
            color: #1a1d29;
        }
        body:not(.design-ios):not(.theme-light) .comment-box .up-col,
        body:not(.design-ios):not(.theme-light) .comment-box .thumb-icon {
            color: #fff;
        }

        /* 실제 순위 목록 안의 내 댓글은 강조 색상만 유지하고 다른 카드와 같은 크기로 표시 */
        body:not(.design-ios) .pinned-comment.ranking-list-comment {
            min-height: 76px;
        }
        body:not(.design-ios) .pinned-comment.ranking-list-comment .profile-pic {
            width: 76px;
            height: 76px;
            min-height: 0;
            flex-basis: 76px;
        }
        body:not(.design-ios) .pinned-comment.ranking-list-comment .rank-number,
        body:not(.design-ios) .pinned-comment.ranking-list-comment .nickname {
            font-size: 23px;
        }
        body:not(.design-ios) .pinned-comment.ranking-list-comment .up-col {
            font-size: 22px;
            min-width: 100px;
        }

        /* 내 카드 위의 커트라인 다음 순위와 UP 차이 */
        .cutoff-row {
            position: relative;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 4px;
            box-sizing: border-box;
        }
        .cutoff-row::before {
            content: "";
            position: absolute;
            left: 4px;
            right: 132px;
            top: 50%;
            height: 2px;
            background-color: var(--accent-color, #FF1744);
            box-shadow: none;
        }
        .cutoff-row::after {
            content: "";
            position: absolute;
            left: 0;
            top: calc(50% - 4px);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-color, #FF1744);
        }
        .cutoff-text {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-width: 118px;
            justify-content: flex-end;
            background: transparent;
            color: var(--text-primary);
            padding: 0;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }
        .cutoff-label {
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
            color: var(--text-secondary);
        }
        .cutoff-value {
            min-width: 44px;
            font-size: 30px;
            line-height: 1;
            font-weight: 900;
            text-align: right;
            color: var(--accent-color, #FF1744);
        }

        .grayed-out { filter: grayscale(100%); opacity: 0.5; }
        .grayed-out .rank-col { color: var(--text-muted) !important; }
        .grayed-out .up-col { color: var(--text-muted); }

        .qr-section {
            display: none;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            background-color: var(--qr-bg);
            border: 1px solid var(--qr-border);
            border-radius: 12px;
            padding: 15px;
            margin-top: 5px;
            gap: 15px;
            box-shadow: 0 4px 10px var(--card-shadow);
        }

        /* UP 차이는 댓글 순위와 무관하게 QR 카드와 순위 목록 사이에 표시 */
        .qr-cutoff-slot { flex: 0 0 100%; width: 100%; }
        .qr-cutoff-slot:empty { display: none; }

        /* 너비(%)는 JS에서 댓글 카드 가로폭(=이 섹션의 폭) 기준으로 지정됨 */
        .qr-image { position: relative; width: 100%; aspect-ratio: 1 / 1; background-color: white; padding: 10px; border-radius: 8px; box-sizing: border-box; flex-shrink: 0; margin: 0 auto; }
        .qr-image svg { width: 100%; height: 100%; display: block; }
        .qr-profile-image {
            display: none;
            position: absolute;
            left: 50%;
            top: 50%;
            width: 19%;
            height: 19%;
            transform: translate(-50%, -50%);
            border: 5px solid #fff;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .28);
            object-fit: cover;
            box-sizing: border-box;
            z-index: 2;
        }
        .qr-text-col { display: flex; flex-direction: column; gap: 6px; flex: 1 1 150px; min-width: 150px; }
        .qr-desc { font-size: 15px; font-weight: 600; color: var(--qr-desc-color); line-height: 1.4; word-break: keep-all; white-space: pre-line; text-align: center; }
        .update-time { display: none; }

        /* ===== 디자인2: 귀엽고 통통 튀는 팝 스타일 ===== */
        body.design-ios #widget-container {
            position: relative;
            border: none;
            border-radius: 36px;
            background: rgba(26, 22, 38, 0.86);
            box-shadow: none;
            overflow: hidden;
        }
        body.design-ios .widget-header { align-items: center; padding: 4px 4px 2px; }
        body.design-ios .widget-title { font-size: 27px; letter-spacing: -0.04em; }
        body.design-ios .comment-box {
            border-radius: 24px;
            padding: 16px 20px;
            border: 2px solid rgba(255, 255, 255, 0.13);
            background: rgba(0, 0, 0, 0.96);
            box-shadow: none;
        }
        body.design-ios .rank-col { width: 44px; }
        body.design-ios .rank-number {
            display: inline;
            width: auto;
            height: auto;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            color: var(--text-primary);
            font-size: 26px;
            transform: translateY(7px);
        }
        body.design-ios .profile-pic { border: none; box-shadow: none; }
        body.design-ios .nickname { font-size: 22px; letter-spacing: -0.02em; }
        body.design-ios .userid { display: none; }
        body.design-ios .up-col {
            font-size: 21px;
        }
        body.design-ios .pinned-comment {
            border-radius: 26px;
            border: 2px solid #999;
            background: linear-gradient(135deg, rgba(72, 59, 8, 0.98), rgba(38, 31, 3, 0.98));
            box-shadow: none;
        }
        body.design-ios .pinned-comment .rank-number,
        body.design-ios .pinned-comment .nickname { color: #fff; }
        body.design-ios .pinned-comment .up-col,
        body.design-ios .pinned-comment .thumb-icon {
            color: #fff;
        }
        body.design-ios:not(.theme-light) .comment-box:not(.pinned-comment) {
            background: #000;
        }
        body.design-ios:not(.theme-light) .comment-box:not(.pinned-comment) .up-col,
        body.design-ios:not(.theme-light) .comment-box:not(.pinned-comment) .thumb-icon {
            color: #fff;
        }
        body.design-ios:not(.theme-light) .comment-box.grayed-out {
            opacity: 1;
        }
        body.design-ios:not(.theme-light) .pinned-comment {
            border-color: #999;
            background: #555;
        }
        body.design-ios:not(.theme-light) .pinned-comment.grayed-out {
            filter: none;
        }
        body.design-ios:not(.theme-light) .pinned-comment .up-col,
        body.design-ios:not(.theme-light) .pinned-comment .thumb-icon {
            color: var(--accent-color, #FF3B30);
        }
        body.design-ios .cutoff-text { border: 0; border-radius: 0; padding: 0; box-shadow: none; }
        body.design-ios .qr-section { border: 2px solid rgba(var(--accent-color-rgb), .5); border-radius: 26px; box-shadow: none; }
        body.design-ios .qr-image { border: 4px solid #fff; border-radius: 22px; box-shadow: none; }
        body.design-ios .qr-profile-image { box-shadow: none; }
        body.design-ios .deadline-text { border: 2px solid rgba(var(--accent-color-rgb), .55); border-radius: 999px; box-shadow: none; }
        body.design-ios .highlight-badge { border: 2px solid rgba(255,255,255,.78); border-radius: 999px; }

        /* 디자인2(아이폰 스타일) + 라이트 모드 조합: 유리 배경을 밝은 톤으로 전환 */
        body.design-ios.theme-light #widget-container {
            background: rgba(255, 249, 253, 0.94);
            box-shadow: none;
        }
        body.design-ios.theme-light .comment-box {
            border: 2px solid #e5e7f0;
            background: #ffffff;
            box-shadow: none;
        }
        body.design-ios.theme-light .comment-box:not(.pinned-comment) .up-col,
        body.design-ios.theme-light .comment-box:not(.pinned-comment) .thumb-icon {
            color: var(--text-primary);
        }
        body.design-ios.theme-light .profile-pic { border: none; }
        body.design-ios.theme-light .pinned-comment {
            border: 2px solid #d9d9de !important;
            outline: none !important;
            background: #fff3b0;
            box-shadow: none !important;
        }
        body.design-ios.theme-light .pinned-comment.grayed-out {
            filter: none;
            opacity: 1;
        }
        body.design-ios.theme-light .pinned-comment .rank-number,
        body.design-ios.theme-light .pinned-comment .nickname {
            color: var(--text-primary);
        }
        body.design-ios.theme-light .pinned-comment .up-col,
        body.design-ios.theme-light .pinned-comment .thumb-icon {
            color: var(--accent-color, #FF3B30);
        }

        }
        .rank-number.rank-change-up { color: #4CAF50 !important; }

// QR 50% 이하에서는 900x500 가로형, 그 외에는 500x1000 세로형 캔버스를 사용함
(function () {
    const params = new URLSearchParams(window.location.search);
    const qrSize = parseInt(params.get('qrsize') || '100', 10);
    const horizontalLayout = params.get('qr') === 'on' && qrSize <= 50;
    const DESIGN_WIDTH = horizontalLayout ? 900 : 500;
    const DESIGN_HEIGHT = horizontalLayout ? 500 : 1000;
    const stage = document.getElementById('scale-stage');

    if (horizontalLayout) document.body.classList.add('layout-horizontal');

    // 'zoom'을 지원하는 브라우저(OBS의 크로미움 기반 브라우저 소스, Chrome, Edge 등)에서는
    // transform: scale() 대신 zoom을 사용함. transform: scale()은 이미 렌더링된 화면을
    // 그대로 늘리기만 해서 글씨가 뭉개지는 반면, zoom은 지정한 배율 그대로 레이아웃을
    // 다시 계산해서 그리기 때문에 화면을 축소해서 배치해도 글씨가 훨씬 선명하게 보임.
    const supportsZoom = 'zoom' in document.documentElement.style;

    function applyScale() {
        if (!stage) return;
        const widget = document.getElementById('widget-container');
        // 비동기로 댓글이 추가되어 기본 캔버스보다 길어지는 경우에도 전체가 화면 안에 들어오게 한다.
        const contentWidth = Math.max(DESIGN_WIDTH, widget ? widget.scrollWidth + 40 : 0);
        const contentHeight = Math.max(DESIGN_HEIGHT, widget ? widget.scrollHeight + 40 : 0);
        const scaleX = window.innerWidth / contentWidth;
        const scaleY = window.innerHeight / contentHeight;
        const scale = Math.min(scaleX, scaleY);

        if (supportsZoom) {
            stage.style.transform = '';
            stage.style.zoom = scale;
        } else {
            stage.style.zoom = '';
            stage.style.transform = `scale(${scale})`;
        }
    }

    window.addEventListener('resize', applyScale);
    window.fitWidgetToViewport = applyScale;
    const widget = document.getElementById('widget-container');
    if (widget && 'ResizeObserver' in window) {
        new ResizeObserver(() => requestAnimationFrame(applyScale)).observe(widget);
    }
    applyScale();
})();

const THUMB_SVG = `<svg class="thumb-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M1 21h4V9H1v12zM23 10c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 8.59 6.59C8.22 6.95 8 7.45 8 8v11c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>`;

// key(댓글 고유 식별자) -> DOM 엘리먼트 매핑. 새로고침마다 재사용해서 깜빡임 방지
const commentElements = new Map();

// key -> { rank, upCount } : 직전 새로고침 시점의 순위/추천수. 이번 값과 비교해서 증감 뱃지를 표시하는 데 사용
const commentStats = new Map();

function rankDeltaMarkup(delta) {
    if (!delta) return '';
    if (delta > 0) return `<span class="delta-badge delta-up">▲${delta}</span>`; // 순위 숫자가 작아짐 = 순위 상승
    return `<span class="delta-badge delta-down">▼${Math.abs(delta)}</span>`;

function showRankChange(el, rankText, rankDelta) {
    const rankEl = el.querySelector('.rank-number');
    if (!rankEl) return;

    if (el._rankChangeTimer) {
        clearTimeout(el._rankChangeTimer);
        el._rankChangeTimer = null;
    }

    rankEl.classList.remove('rank-change', 'rank-change-up', 'rank-change-down');

    if (!rankDelta) {
        rankEl.textContent = rankText;
        return;
    }

    const isUp = rankDelta > 0;
    rankEl.textContent = `${isUp ? '▲' : '▼'}${Math.abs(rankDelta)}`;
    rankEl.classList.add('rank-change', isUp ? 'rank-change-up' : 'rank-change-down');

    el._rankChangeTimer = setTimeout(() => {
        rankEl.textContent = rankText;
        rankEl.classList.remove('rank-change', 'rank-change-up', 'rank-change-down');
        el._rankChangeTimer = null;
    }, 1800);
}

function upDeltaMarkup(delta) {
    if (!delta) return '';
    if (delta > 0) return `<span class="delta-badge delta-up"><span class="delta-arrow">▲</span>${delta}</span>`;
    return `<span class="delta-badge delta-down"><span class="delta-arrow">▼</span>${Math.abs(delta)}</span>`;
}

// 포인트 색상 프리셋 (색상 키 -> hex / rgb 값)
const ACCENT_COLORS = {
    red: { hex: '#FF3B30', rgb: '255, 59, 48' },
    orange: { hex: '#FF9500', rgb: '255, 149, 0' },
    yellow: { hex: '#FFCC00', rgb: '255, 204, 0' },
    green: { hex: '#34C759', rgb: '52, 199, 89' },
    blue: { hex: '#0A84FF', rgb: '10, 132, 255' },
    purple: { hex: '#AF52DE', rgb: '175, 82, 222' },
    pink: { hex: '#FF8FB1', rgb: '255, 143, 177' },
    black: { hex: '#48484A', rgb: '72, 72, 74' },
    none: { hex: '#FFFFFF', rgb: '255, 255, 255' }
};

function applyAccentColor(colorKey) {
    let preset = ACCENT_COLORS[colorKey];

    if (!preset && /^#[0-9a-f]{6}$/i.test(colorKey)) {
        const hex = colorKey.toUpperCase();
        const rgb = [
            parseInt(hex.slice(1, 3), 16),
            parseInt(hex.slice(3, 5), 16),
            parseInt(hex.slice(5, 7), 16)
        ].join(', ');
        preset = { hex, rgb };
    }

    preset = preset || ACCENT_COLORS.red;
    document.documentElement.style.setProperty('--accent-color', preset.hex);
    document.documentElement.style.setProperty('--accent-color-rgb', preset.rgb);
}

function applyDesignPreset(designKey) {
    document.body.classList.toggle('design-ios', designKey === 'ios');
}

function applyThemePreset(themeKey) {
    document.body.classList.toggle('theme-light', themeKey === 'light');
}

function startDeadlineCountdown(element, deadlineValue) {
    if (window.deadlineCountdownTimer) clearInterval(window.deadlineCountdownTimer);

    const deadlineTime = new Date(deadlineValue).getTime();
    if (!Number.isFinite(deadlineTime)) {
        element.style.display = 'none';
        return;
    }

    element.innerHTML = ['days', 'hours', 'minutes', 'seconds'].map((key) => {
        const labels = { days: '일', hours: '시간', minutes: '분', seconds: '초' };
        return `<span class="countdown-unit" data-unit="${key}"><strong class="countdown-value">--</strong><span class="countdown-label">${labels[key]}</span></span>`;
    }).join('');

    const setValue = (key, value) => {
        const unit = element.querySelector(`[data-unit="${key}"]`);
        const valueElement = unit?.querySelector('.countdown-value');
        if (!unit || !valueElement) return;
        if (key === 'days') unit.style.display = value === 0 ? 'none' : 'inline-flex';

        const nextValue = String(value).padStart(2, '0');
        if (valueElement.textContent === nextValue) return;
        valueElement.textContent = nextValue;
        valueElement.classList.remove('is-flipping');
        void valueElement.offsetWidth;
        valueElement.classList.add('is-flipping');
    };

    const update = () => {
        const remaining = Math.max(0, deadlineTime - Date.now());
        if (remaining <= 0) {
            element.innerHTML = '<strong class="countdown-ended">마감되었습니다</strong>';
            if (window.deadlineCountdownTimer) clearInterval(window.deadlineCountdownTimer);
            return;
        }

        const totalSeconds = Math.floor(remaining / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        setValue('days', days);
        setValue('hours', hours);
        setValue('minutes', minutes);
        setValue('seconds', seconds);
    };

    element.style.display = 'flex';
    update();
    window.deadlineCountdownTimer = setInterval(update, 1000);
}

// 1. 위젯 화면의 기본 정보(제목, 마감일, QR) 세팅하기
function setupWidgetUI(urlParams) {
    const title = urlParams.get('title');
    const deadline = urlParams.get('deadline');
    const deadlineEnabled = urlParams.get('deadlineMode') === 'on' || (!!deadline && !urlParams.has('deadlineMode'));
    const font = urlParams.get('font') || 'gmarket';
    const design = urlParams.get('design') || 'default';
    const theme = urlParams.get('theme') || 'light';
    const background = urlParams.get('background') || 'on';
    const color = urlParams.get('color') || 'red';
    const qrMode = urlParams.get('qr');
    const qrPosition = urlParams.get('qrpos') || 'top';
    const qrText = urlParams.get('qrtext');
    const qrSize = urlParams.get('qrsize') || '100';
    const qrFontSize = urlParams.get('qrFontSize') || '15';
    const qrFontColor = urlParams.get('qrFontColor') || '#3d4152';
    const qrLinkMode = urlParams.get('qrLinkMode') || 'auto';
    const qrCustomLink = urlParams.get('qrCustomLink') || '';
    const sizePercent = parseInt(qrSize, 10);
    const horizontalLayout = qrMode === 'on' && Number.isFinite(sizePercent) && sizePercent <= 50;

    applyFontPreset(font);
    applyDesignPreset(design);
    applyThemePreset(theme);
    document.body.classList.toggle('background-off', background === 'off');
    applyAccentColor(color);
    document.body.classList.toggle('layout-horizontal', horizontalLayout);
    document.body.classList.toggle('qr-bottom', qrPosition === 'bottom');

    const headerEl = document.querySelector('.widget-header');
    const titleEl = document.getElementById("widget-title-display");
    const deadlineEl = document.getElementById("deadline-display");

    if (titleEl) {
        if (title && title.trim()) {
            titleEl.innerText = title.trim();
            titleEl.style.display = "block";
        } else {
            titleEl.style.display = "none";
        }
    }

    if (deadlineEl) deadlineEl.style.display = "none";

    if (headerEl && !title?.trim()) {
        headerEl.style.display = "none";
    }

    const qrSection = document.getElementById("qr-section");
    const qrColumn = document.getElementById("qr-column");
    const deadlineCountdown = document.getElementById("deadline-countdown");
    const qrDesc = document.getElementById("qr-desc");
    const qrImg = document.getElementById("qr-code-img");
    // QR 코드 연결 링크: "직접 입력"을 선택했으면 그 주소를, 아니면 댓글 링크(url)를 그대로 사용
    const linkUrl = (qrLinkMode === 'custom' && qrCustomLink) ? qrCustomLink : urlParams.get('url');

    if (deadlineEnabled && deadline && deadlineCountdown) {
        if (qrColumn) qrColumn.style.display = "flex";
        startDeadlineCountdown(deadlineCountdown, deadline);
    }

    if (qrMode === 'on') {
        if (qrColumn) qrColumn.style.display = "flex";
        if (qrSection) qrSection.style.display = "flex";
        if (qrDesc && qrText) qrDesc.innerText = qrText;

        // 댓글 카드 가로폭(=qr-section 폭) 기준 QR 코드 크기 지정
        if (qrImg) {
            if (horizontalLayout) {
                if (qrColumn) qrColumn.style.setProperty('--qr-column-width', sizePercent + '%');
                qrImg.style.width = '100%';
            } else {
                qrImg.style.width = (Number.isFinite(sizePercent) ? sizePercent : 100) + '%';
            }
        }

        // 안내 문구 글자 크기/색상 지정
        if (qrDesc) {
            qrDesc.style.fontSize = qrFontSize + 'px';
            qrDesc.style.color = qrFontColor;
        }

        // QR 코드는 외부 이미지 API에 의존하면 OBS 브라우저 소스 환경에 따라
        // 요청이 막히거나 지연되어 표시가 안 될 수 있으므로, 페이지에 내장된
        // 라이브러리로 직접(오프라인) SVG QR 코드를 생성해서 넣음
        if (qrImg && linkUrl) {
            try {
                // 중앙 프로필 사진이 일부 모듈을 가려도 인식률을 유지하도록 오류 복원 수준을 H로 사용
                const qr = qrcode(0, 'H'); // typeNumber 0 = 자동 크기 선택
                qr.addData(linkUrl);
                qr.make();
                const profileImage = document.getElementById('qr-profile-image');
                qrImg.innerHTML = qr.createSvgTag({ scalable: true, margin: 0 });
                if (profileImage) qrImg.appendChild(profileImage);
            } catch (e) {
                console.error("QR 코드 생성 실패:", e);
            }
        }
    }
}

// 2. 서버에서 실시간 댓글 데이터 가져오기
async function fetchRealComments() {
    const urlParams = new URLSearchParams(window.location.search);

    if (!window.uiSetupDone) {
        setupWidgetUI(urlParams);
        window.uiSetupDone = true;
    }

    const targetUrl = urlParams.get('url');
    if (!targetUrl) {
        console.warn("OBS 위젯: url 파라미터가 없습니다. 링크 생성기에서 다시 생성해주세요.");
        return;
    }

    const match = targetUrl.match(/(?:#|[?&])comment_noti_?(\d+)/i)
        || targetUrl.match(/[?&](?:pCommentNo|commentNo)=(\d+)/i);
    const targetCommentId = match ? match[1] : null;

    const cutoff = parseInt(urlParams.get('cutoff'), 10) || 0;
    const showCutoffGap = urlParams.get('cutoffGap') === 'on';
    const mode = urlParams.get('mode') || 'mine';
    const pinEnabled = urlParams.get('pin') !== 'off';
    const aroundUp = parseInt(urlParams.get('aroundUp'), 10);
    const aroundDown = parseInt(urlParams.get('aroundDown'), 10);
    const pinNicknames = (urlParams.get('pinNicks') || '')
        .split(',')
        .map(s => s.trim())
        .filter(Boolean);

    try {
        const cleanUrl = targetUrl.split('#')[0];
        const highlightParam = targetCommentId ? `&highlight=${encodeURIComponent(targetCommentId)}` : '';
        const apiUrl = `/api/comment?url=${encodeURIComponent(cleanUrl)}${highlightParam}&_=${Date.now()}`;

        const response = await fetch(apiUrl, { cache: 'no-store' });
        if (!response.ok) {
            let message = `서버 통신 오류 (${response.status})`;
            try {
                const errorData = await response.json();
                if (errorData && errorData.error) message += `: ${errorData.error}`;
            } catch (_) {}
            throw new Error(message);
        }

        const data = await response.json();
        console.log("SOOP 원본 데이터:", data);

        renderComments(data, targetCommentId, showCutoffGap ? cutoff : 0, mode, aroundUp, aroundDown, pinEnabled, pinNicknames, showCutoffGap);

        const updateEl = document.getElementById("update-time-display");
        if (updateEl) {
            const now = new Date();
            updateEl.innerText = `업데이트: ${now.toLocaleTimeString('ko-KR')}`;
        }

    } catch (error) {
        console.error("데이터 로드 실패:", error);
        const listContainer = document.getElementById("comment-list");
        if (listContainer && commentElements.size === 0) {
            listContainer.innerHTML = `<div class="load-error" style="color:#d33; font-size:14px; line-height:1.5;">순위 데이터를 불러오지 못했습니다.<br><small>${escapeHtml(error.message)}</small></div>`;
        }
    }
}

// 댓글 고유 key 생성 (id 우선, 없으면 닉네임+순번으로 fallback)
function getCommentKey(comment, fallbackIndex) {
    const id = comment.pCommentNo ?? comment.comment_no ?? comment.id;
    if (id !== undefined && id !== null && id !== "") return 'c:' + String(id);
    const nickname = comment.userNick || comment.user_nickname || comment.userId || "";
    return 'c:' + nickname + ':' + fallbackIndex;
}

// 링크로 지정한 "내 댓글"의 프로필 사진을 QR 중앙에 표시
function updateQrProfileImage(comment) {
    const profileEl = document.getElementById('qr-profile-image');
    if (!profileEl) return;

    const profileUrl = comment && (comment.profileImage || comment.profile_image || "");
    if (!profileUrl) {
        profileEl.removeAttribute('src');
        profileEl.style.display = 'none';
        return;
    }

    profileEl.onload = () => { profileEl.style.display = 'block'; };
    profileEl.onerror = () => { profileEl.style.display = 'none'; };
    if (profileEl.getAttribute('src') !== profileUrl) profileEl.src = profileUrl;
    else if (profileEl.complete && profileEl.naturalWidth > 0) profileEl.style.display = 'block';
}

// 3. 댓글 목록 업데이트 (지우고 다시 그리는 대신, 기존 엘리먼트 재사용 + 순서만 이동)
function renderComments(data, targetCommentId, cutoff, mode, aroundUp, aroundDown, pinEnabled, pinNicknames, showCutoffGap) {
    const listContainer = document.getElementById("comment-list");
    if (!listContainer) return;

    const comments = data.data || data.comment_list || data.list || data.result || [];

    if (!Array.isArray(comments) || comments.length === 0) {
        if (commentElements.size === 0 && listContainer.children.length === 0) {
            listContainer.innerHTML = `<div style="color:#999; font-size:14px;">댓글이 없거나 데이터를 불러오지 못했습니다.</div>`;
        }
        return;
    }

    if (commentElements.size === 0 && listContainer.children.length > 0) {
        listContainer.innerHTML = "";
    }

    let pinnedComment = null;

    comments.forEach((comment) => {
        const currentCommentId = String(comment.pCommentNo || comment.comment_no || comment.id || "");
        const isFlaggedHighlight = comment.isHighlight === true;
        if (!pinnedComment && ((targetCommentId && currentCommentId === targetCommentId) || (!targetCommentId && isFlaggedHighlight))) {
            pinnedComment = comment;
        }
    });

    updateQrProfileImage(pinnedComment);

    // 추천수(좋아요) 기준 내림차순 정렬. 내 댓글도 여기 포함시켜서 아래 목록에도 실제 순위 자리에 나오게 함
    const rankedComments = [...comments].sort((a, b) => (b.likeCnt ?? 0) - (a.likeCnt ?? 0));

    // 고정 댓글의 실제 순위 (정렬된 전체 목록 내 위치)
    let pinnedRank = null;
    if (pinnedComment) {
        pinnedRank = rankedComments.indexOf(pinnedComment) + 1;
    }

    // 닉네임으로 추가 고정된 댓글들 찾기 (링크로 지정된 고정 댓글과는 별개로 여러 명 지정 가능)
    const nickPinnedList = [];
    if (Array.isArray(pinNicknames) && pinNicknames.length > 0) {
        const usedComments = new Set();
        if (pinnedComment) usedComments.add(pinnedComment);

        const nicknameOf = (c) => String(c.userNick || c.user_nickname || c.userId || c.user_id || "");
        // 닉네임 뒤에 붙는 특수문자(_, -, ! 등)는 무시하고 비교. 예: "단즈_"도 "단즈"로 검색하면 매칭됨
        const normalizeNick = (s) => String(s).toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');

        pinNicknames.forEach(nick => {
            const target = normalizeNick(nick);
            const found = rankedComments.find(c => !usedComments.has(c) && normalizeNick(nicknameOf(c)) === target);
            if (found) {
                usedComments.add(found);
                nickPinnedList.push({ comment: found, rank: rankedComments.indexOf(found) + 1, nick });
            }
        });

        // 내 댓글 아래의 추가 고정 댓글은 입력 순서가 아닌 실제 순위가 높은 순서로 표시
        nickPinnedList.sort((a, b) => a.rank - b.rank);
    }

    let visibleComments = rankedComments.map((c, i) => ({ comment: c, rank: i + 1 }));
    if (mode === 'mine') {
        visibleComments = [];
    } else if (mode === 'around' && pinnedComment) {
        const upCount = Number.isFinite(aroundUp) && aroundUp >= 0 ? aroundUp : 3;
        const downCount = Number.isFinite(aroundDown) && aroundDown >= 0 ? aroundDown : 3;
        const centerRank = pinnedRank;
        visibleComments = visibleComments.filter(v => v.rank >= centerRank - upCount && v.rank <= centerRank + downCount);
    }

    // 이번 새로고침에서 보여야 할 행(row) 순서 계산
    const rows = [];

    // 내 UP 수와 커트라인 바로 다음 순위의 UP 수 차이를 계산
    let cutoffDiff = null;
    const comparisonRank = cutoff + 1;
    if (showCutoffGap && pinnedComment && cutoff > 0 && rankedComments.length >= comparisonRank) {
        const comparisonComment = rankedComments[comparisonRank - 1];
        const myUp = pinnedComment.likeCnt ?? pinnedComment.up_cnt ?? pinnedComment.good_cnt ?? 0;
        const comparisonUp = comparisonComment.likeCnt ?? comparisonComment.up_cnt ?? comparisonComment.good_cnt ?? 0;
        cutoffDiff = Math.abs(myUp - comparisonUp);
    }

    const canShowCutoffGap = showCutoffGap && cutoffDiff !== null && pinnedComment;

    // 주변 보기에서는 실제 커트라인 경계에, 나머지 모드에서는 QR과 순위 목록 사이에 표시한다.
    renderQrCutoffGap(canShowCutoffGap && mode !== 'around' ? cutoffDiff : null, comparisonRank);

    // 상단 고정 카드 (켜기 상태이거나, "내 순위만 보기" 모드일 때만 표시)
    const showPinnedCard = pinnedComment && (pinEnabled || mode === 'mine');
    if (showPinnedCard) {
        const upCount = pinnedComment.likeCnt ?? pinnedComment.up_cnt ?? pinnedComment.good_cnt ?? 0;
        const prevStats = commentStats.get('pinned');
        const rankDelta = prevStats ? prevStats.rank - pinnedRank : 0;
        const upDelta = prevStats ? upCount - prevStats.upCount : 0;
        rows.push({ key: 'pinned', type: 'comment', comment: pinnedComment, rankText: pinnedRank, extraClass: 'pinned-comment', isPinned: true, danger: cutoff > 0 && pinnedRank > cutoff, rankDelta, upDelta });
        commentStats.set('pinned', { rank: pinnedRank, upCount });
    }

    // 닉네임으로 지정한 고정 댓글 카드들 (여러 명 가능)
    nickPinnedList.forEach(({ comment, rank, nick }) => {
        const upCount = comment.likeCnt ?? comment.up_cnt ?? comment.good_cnt ?? 0;
        const statKey = 'pinnedNick:' + nick.toLowerCase();
        const prevStats = commentStats.get(statKey);
        const rankDelta = prevStats ? prevStats.rank - rank : 0;
        const upDelta = prevStats ? upCount - prevStats.upCount : 0;
        rows.push({ key: statKey, type: 'comment', comment, rankText: rank, extraClass: 'pinned-comment', isPinned: true, danger: cutoff > 0 && rank > cutoff, rankDelta, upDelta });
        commentStats.set(statKey, { rank, upCount });
    });

    // 아래 랭킹 목록: 내 댓글도 실제 순위 자리에 함께 표시됨 (위 고정 카드와는 별개의 DOM으로 관리)
    visibleComments.forEach(({ comment, rank }) => {
        const isMine = comment === pinnedComment;
        const nickPinMatch = nickPinnedList.find(n => n.comment === comment);
        const isNickPinned = !!nickPinMatch;
        const isBelowCutoff = cutoff > 0 && rank > cutoff;
        const key = 'list:' + getCommentKey(comment, rank);
        const upCount = comment.likeCnt ?? comment.up_cnt ?? comment.good_cnt ?? 0;
        const prevStats = commentStats.get(key);
        const rankDelta = prevStats ? prevStats.rank - rank : 0;
        const upDelta = prevStats ? upCount - prevStats.upCount : 0;
        const classNames = [
            'ranking-list-comment',
            isBelowCutoff ? 'grayed-out' : '',
            (isMine || isNickPinned) ? 'pinned-comment' : ''
        ].filter(Boolean).join(' ');
        rows.push({
            key,
            type: 'comment',
            comment,
            rankText: rank,
            extraClass: classNames,
            isPinned: isMine || isNickPinned,
            danger: (isMine || isNickPinned) && isBelowCutoff,
            rankDelta,
            upDelta
        });
        commentStats.set(key, { rank, upCount });

        // 예: 커트라인 45위라면 45위 카드 바로 뒤, 즉 45위와 46위 사이에 표시한다.
        if (mode === 'around' && canShowCutoffGap && rank === cutoff) {
            rows.push({ key: 'cutoff-gap', type: 'cutoff', diff: cutoffDiff, comparisonRank });
        }
    });

    // 순위 변동 애니메이션(FLIP)을 위해 재배치 전 기존 엘리먼트 위치 기록
    const oldRects = new Map();
    commentElements.forEach((el, key) => {
        oldRects.set(key, el.getBoundingClientRect());
    });

    const newKeys = new Set(rows.map(r => r.key));

    // 더 이상 없어야 하는 댓글 제거
    commentElements.forEach((el, key) => {
        if (!newKeys.has(key)) {
            el.remove();
            commentElements.delete(key);
        }
    });
    commentStats.forEach((_, key) => {
        if (!newKeys.has(key)) commentStats.delete(key);
    });

    // 각 행을 생성(신규) 또는 갱신(기존)하고, 올바른 순서로 재배치
    const placed = [];
    rows.forEach(row => {
        let el = commentElements.get(row.key);
        let isNew = false;

        if (!el) {
            isNew = true;
            el = row.type === 'cutoff'
                ? createCutoffElement(row.diff, row.comparisonRank)
                : createCommentElement(row.comment, row.rankText, row.extraClass, row.isPinned, row.rankDelta, row.upDelta, row.badge, row.danger);
            commentElements.set(row.key, el);
        } else if (row.type === 'comment') {
            updateCommentElement(el, row.comment, row.rankText, row.extraClass, row.isPinned, row.rankDelta, row.upDelta, row.badge, row.danger);
        } else if (row.type === 'cutoff') {
            updateCutoffElement(el, row.diff, row.comparisonRank);
        }

        listContainer.appendChild(el); // 기존 노드면 위치만 이동
        placed.push({ el, key: row.key, isNew });
    });

    // 신규 항목은 페이드 인, 기존 항목은 순위가 실제로 바뀐 경우에만 슥 이동
    placed.forEach(({ el, key, isNew }) => {
        if (isNew) {
            el.style.transition = 'none';
            el.style.opacity = '0';
            el.style.transform = 'translateY(8px)';
            requestAnimationFrame(() => {
                el.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
            });
            return;
        }

        const oldRect = oldRects.get(key);
        if (!oldRect) return;
        const newRect = el.getBoundingClientRect();
        const deltaY = oldRect.top - newRect.top;

        if (Math.abs(deltaY) > 1) {
            el.style.transition = 'none';
            el.style.transform = `translateY(${deltaY}px)`;
            void el.offsetHeight;
            requestAnimationFrame(() => {
                el.style.transition = 'transform 0.4s ease';
                el.style.transform = 'translateY(0)';
            });
        }
    });
}

function cutoffLabel(diff) {
    if (diff === null || diff === undefined || Number.isNaN(diff)) return '';
    return String(Math.abs(diff));
}

function cutoffGapLabel() {
    return 'UP 차이';
}

function createCutoffElement(diff, comparisonRank) {
    const row = document.createElement("div");
    row.className = "cutoff-row";
    row.innerHTML = `<span class="cutoff-text"><span class="cutoff-label">${cutoffGapLabel(comparisonRank)}</span><strong class="cutoff-value">${cutoffLabel(diff)}</strong></span>`;
    return row;
}

function updateCutoffElement(el, diff, comparisonRank) {
    const labelEl = el.querySelector('.cutoff-label');
    const valueEl = el.querySelector('.cutoff-value');
    const label = cutoffGapLabel(comparisonRank);
    const value = cutoffLabel(diff);
    if (labelEl && labelEl.textContent !== label) labelEl.textContent = label;
    if (valueEl && valueEl.textContent !== value) valueEl.textContent = value;
}

function renderQrCutoffGap(diff, comparisonRank) {
    const slot = document.getElementById('qr-cutoff-slot');
    if (!slot) return;

    if (diff === null || diff === undefined || Number.isNaN(diff)) {
        slot.replaceChildren();
        return;
    }

    let row = slot.querySelector('.cutoff-row');
    if (!row) {
        row = createCutoffElement(diff, comparisonRank);
        slot.appendChild(row);
        const qrColumn = document.getElementById('qr-column');
        if (qrColumn) qrColumn.style.display = 'flex';
    } else {
        updateCutoffElement(row, diff, comparisonRank);
    }
}

// 신규 댓글 엘리먼트 생성 (최초 1회만 실행, 이후엔 updateCommentElement로 내용만 갱신)
function createCommentElement(comment, rankText, extraClass, isPinned, rankDelta, upDelta, badgeText, danger) {
    const nickname = comment.userNick || comment.user_nickname || comment.userId || "알 수 없음";
    const userId = comment.userId || comment.user_id || "";
    const profileImg = comment.profileImage || comment.profile_image || "";
    const upCount = comment.likeCnt ?? comment.up_cnt ?? comment.good_cnt ?? 0;

    const box = document.createElement("div");
    box.className = `comment-box ${extraClass}`.trim();

    box.innerHTML = `
        <div class="rank-col">
            <div><span class="rank-number">${rankText}</span><span class="rank-danger" style="display:${danger ? 'block' : 'none'};">위기</span></div>
            <span class="rank-delta-slot"></span>
        </div>
        ${profileImg ? `<img class="profile-pic" src="${profileImg}" alt="">` : `<div class="profile-pic"></div>`}
        <div class="info-col">
            <div class="nickname-wrapper">
                <span class="nickname">${escapeHtml(nickname)}</span>
                ${badgeText ? `<span class="highlight-badge">${escapeHtml(badgeText)}</span>` : ''}
            </div>
            <span class="userid">${escapeHtml(userId)}</span>
        </div>
        <div class="up-col">${THUMB_SVG}<span class="up-count">${upCount}</span><span class="up-delta-slot">${upDeltaMarkup(upDelta)}</span></div>
    `;
    return box;
}

// 기존 댓글 엘리먼트 내용만 갱신 (재생성하지 않음 -> 이미지 재로딩/깜빡임 없음)
function updateCommentElement(el, comment, rankText, extraClass, isPinned, rankDelta, upDelta, badgeText, danger) {
    el.className = `comment-box ${extraClass}`.trim();

    const nickname = comment.userNick || comment.user_nickname || comment.userId || "알 수 없음";
    const userId = comment.userId || comment.user_id || "";
    const profileImg = comment.profileImage || comment.profile_image || "";
    const upCount = comment.likeCnt ?? comment.up_cnt ?? comment.good_cnt ?? 0;

    showRankChange(el, rankText, rankDelta);

    const dangerEl = el.querySelector('.rank-danger');
    if (dangerEl) dangerEl.style.display = danger ? 'block' : 'none';

    const rankDeltaEl = el.querySelector('.rank-delta-slot');
    if (rankDeltaEl) rankDeltaEl.innerHTML = '';

    const nickEl = el.querySelector('.nickname');
    if (nickEl && nickEl.textContent !== nickname) nickEl.textContent = nickname;

    const wrapperEl = el.querySelector('.nickname-wrapper');
    if (wrapperEl) {
        let badgeEl = wrapperEl.querySelector('.highlight-badge');
        if (badgeText) {
            if (!badgeEl) {
                badgeEl = document.createElement('span');
                badgeEl.className = 'highlight-badge';
                wrapperEl.appendChild(badgeEl);
            }
            if (badgeEl.textContent !== badgeText) badgeEl.textContent = badgeText;
        } else if (badgeEl) {
            badgeEl.remove();
        }
    }

    const userIdEl = el.querySelector('.userid');
    if (userIdEl && userIdEl.textContent !== userId) userIdEl.textContent = userId;

    const upEl = el.querySelector('.up-count');
    if (upEl && upEl.textContent !== String(upCount)) upEl.textContent = upCount;

    const upDeltaEl = el.querySelector('.up-delta-slot');
    if (upDeltaEl) upDeltaEl.innerHTML = upDeltaMarkup(upDelta);

    const img = el.querySelector('.profile-pic');
    if (img && img.tagName === 'IMG' && profileImg && img.getAttribute('src') !== profileImg) {
        img.src = profileImg;
    }
}

function escapeHtml(str) {
    const div = document.createElement("div");
    div.innerText = String(str ?? "");
    return div.innerHTML;
}

setInterval(fetchRealComments, 5000);
fetchRealComments();
</script>
